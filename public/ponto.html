<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ponto</title>
    <style>
      /*
        A tela do tablet preso na parede.
        Três regras mandam aqui: alvo grande (quem bate está com a mão cheia
        ou molhada), fundo escuro (fica ligado a noite toda num corredor) e
        nenhuma informação sensível (passa cliente, fornecedor e entregador).
      */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --fundo: #14110d;
        --superficie: #1e1911;
        --superficie2: #2a2318;
        --borda: #3a3122;
        --papel: #f2ece0;
        --suave: #a89a86;
        --brasa: #e8a33d;
        --ok: #7cb37a;
        --erro: #d9705a;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--fundo);
        color: var(--papel);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
      }
      body { display: flex; flex-direction: column; }

      header {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--borda);
      }
      header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
      #relogio { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--brasa); }
      #dia { color: var(--suave); font-size: 0.85rem; }

      main { flex: 1; padding: 20px 22px 32px; overflow-y: auto; }
      .passo { display: none; }
      .passo.ativo { display: block; }
      /* Num tablet de parede o teclado encostado na esquerda obriga a torcer
         o corpo para alcançar. Centralizado, a mão chega de qualquer lado. */
      #passo-pin { max-width: 380px; margin: 0 auto; }
      #passo-acao { max-width: 640px; margin: 0 auto; }

      .titulo { margin: 0 0 16px; font-size: 1.05rem; color: var(--suave); }

      .pessoas {
        display: grid; gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      }
      .pessoa {
        display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
        min-height: 92px; padding: 16px 18px; border-radius: 14px; cursor: pointer;
        background: var(--superficie); border: 1px solid var(--borda); color: var(--papel);
        font-size: 1.15rem; font-weight: 600; text-align: left;
      }
      .pessoa:active { background: var(--superficie2); }
      .pessoa .estado { font-size: 0.8rem; font-weight: 400; color: var(--suave); }
      .pessoa.dentro { border-color: var(--ok); }
      .pessoa.dentro .estado { color: var(--ok); }
      .pessoa.sem-pin { opacity: 0.5; }

      .acoes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); max-width: 640px; }
      .acao {
        padding: 24px; border-radius: 14px; border: 1px solid var(--borda);
        background: var(--superficie); color: var(--papel); font-size: 1.2rem; font-weight: 600; cursor: pointer;
      }
      .acao:active { background: var(--superficie2); }
      .acao.forte { background: var(--brasa); color: #2a1c08; border-color: var(--brasa); }

      .teclado { display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); max-width: 360px; }
      .tecla {
        padding: 22px 0; border-radius: 14px; border: 1px solid var(--borda);
        background: var(--superficie); color: var(--papel); font-size: 1.6rem; font-weight: 600; cursor: pointer;
      }
      .tecla:active { background: var(--superficie2); }

      .bolinhas { display: flex; gap: 14px; margin: 6px 0 22px; }
      .bolinha { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--borda); }
      .bolinha.cheia { background: var(--brasa); border-color: var(--brasa); }

      .voltar {
        margin-top: 20px; padding: 14px 22px; border-radius: 12px; cursor: pointer;
        background: none; border: 1px solid var(--borda); color: var(--suave); font-size: 1rem;
      }

      .aviso { margin: 14px 0 0; font-size: 1rem; color: var(--erro); min-height: 24px; }

      .fim { text-align: center; padding: 40px 0; }
      .fim .marca { font-size: 4rem; line-height: 1; }
      .fim h2 { margin: 14px 0 6px; font-size: 1.6rem; }
      .fim p { margin: 0; color: var(--suave); }

      .vazio { color: var(--suave); max-width: 40ch; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="casa">Ponto</h1>
        <div id="dia"></div>
      </div>
      <div id="relogio">--:--</div>
    </header>

    <main>
      <section id="passo-pessoas" class="passo ativo">
        <p class="titulo">Toque no seu nome</p>
        <div id="pessoas" class="pessoas"></div>
      </section>

      <section id="passo-acao" class="passo">
        <p class="titulo" id="titulo-acao"></p>
        <div id="acoes" class="acoes"></div>
        <button class="voltar" type="button" data-voltar>Voltar</button>
      </section>

      <section id="passo-pin" class="passo">
        <p class="titulo" id="titulo-pin"></p>
        <div class="bolinhas" id="bolinhas"></div>
        <div class="teclado" id="teclado"></div>
        <p class="aviso" id="aviso"></p>
        <button class="voltar" type="button" data-voltar>Voltar</button>
      </section>

      <section id="passo-fim" class="passo">
        <div class="fim">
          <div class="marca" id="fim-marca">✅</div>
          <h2 id="fim-titulo"></h2>
          <p id="fim-detalhe"></p>
        </div>
      </section>
    </main>

    <script type="module">
      const TOKEN = location.pathname.split("/").filter(Boolean).pop() ?? "";
      const NOME_DA_BATIDA = {
        entrada: "Entrada",
        pausa: "Pausa",
        volta: "Voltar da pausa",
        saida: "Saída",
      };

      const $ = (id) => document.getElementById(id);
      let estado = { pessoas: [], escolhida: null, tipo: null, pin: "" };
      let voltarPara = null;

      /* ---------- relógio ---------- */
      function tiquetaque() {
        const agora = new Date();
        $("relogio").textContent = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }
      tiquetaque();
      setInterval(tiquetaque, 10_000);

      /* ---------- conversa com a API ---------- */
      async function api(caminho, opcoes = {}) {
        const resposta = await fetch(caminho, {
          ...opcoes,
          headers: opcoes.body ? { "content-type": "application/json" } : {},
        });
        const corpo = await resposta.json().catch(() => null);
        if (!resposta.ok || corpo?.success === false) {
          throw new Error(corpo?.error?.message ?? "Não deu para falar com o servidor.");
        }
        return corpo.data;
      }

      async function carregar() {
        try {
          const tela = await api(`/v1/ponto/${TOKEN}`);
          estado.pessoas = tela.pessoas;
          $("casa").textContent = tela.casa;
          $("dia").textContent = `Dia da casa: ${diaBr(tela.dia)}`;
          desenharPessoas();
        } catch (e) {
          $("pessoas").innerHTML = "";
          const p = document.createElement("p");
          p.className = "vazio";
          p.textContent = e.message;
          $("pessoas").append(p);
        }
      }

      /* ---------- passo 1: quem é você ---------- */
      function desenharPessoas() {
        const area = $("pessoas");
        area.innerHTML = "";

        if (estado.pessoas.length === 0) {
          const p = document.createElement("p");
          p.className = "vazio";
          p.textContent = "Ninguém cadastrado nesta casa ainda. Fale com a gerência.";
          area.append(p);
          return;
        }

        for (const pessoa of estado.pessoas) {
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = `pessoa${pessoa.aberto ? " dentro" : ""}${pessoa.tem_pin ? "" : " sem-pin"}`;
          botao.append(document.createTextNode(pessoa.nome));

          const estadoTexto = document.createElement("span");
          estadoTexto.className = "estado";
          estadoTexto.textContent = !pessoa.tem_pin
            ? "sem PIN — fale com a gerência"
            : (pessoa.ultima ?? "ainda não bateu hoje");
          botao.append(estadoTexto);

          botao.onclick = () => {
            if (!pessoa.tem_pin) return;
            estado.escolhida = pessoa;
            desenharAcoes();
          };
          area.append(botao);
        }
      }

      /* ---------- passo 2: o que vai bater ---------- */
      function desenharAcoes() {
        $("titulo-acao").textContent = `${estado.escolhida.nome}, o que você vai bater?`;
        const area = $("acoes");
        area.innerHTML = "";

        for (const tipo of estado.escolhida.permitidas) {
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = `acao${tipo === "entrada" || tipo === "volta" ? " forte" : ""}`;
          botao.textContent = NOME_DA_BATIDA[tipo] ?? tipo;
          botao.onclick = () => {
            estado.tipo = tipo;
            estado.pin = "";
            desenharPin();
          };
          area.append(botao);
        }
        mostrar("passo-acao", "passo-pessoas");
      }

      /* ---------- passo 3: o PIN ---------- */
      function desenharPin() {
        $("titulo-pin").textContent = `${NOME_DA_BATIDA[estado.tipo]} · ${estado.escolhida.nome} — digite seu PIN`;
        $("aviso").textContent = "";
        desenharBolinhas();

        const teclado = $("teclado");
        teclado.innerHTML = "";
        for (const tecla of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "apagar", "0", "ok"]) {
          const botao = document.createElement("button");
          botao.type = "button";
          botao.className = "tecla";
          botao.textContent = tecla === "apagar" ? "⌫" : tecla === "ok" ? "✓" : tecla;
          botao.onclick = () => teclar(tecla);
          teclado.append(botao);
        }
        mostrar("passo-pin", "passo-acao");
      }

      function desenharBolinhas() {
        const area = $("bolinhas");
        area.innerHTML = "";
        for (let i = 0; i < 4; i++) {
          const b = document.createElement("span");
          b.className = `bolinha${i < estado.pin.length ? " cheia" : ""}`;
          area.append(b);
        }
      }

      function teclar(tecla) {
        if (tecla === "apagar") estado.pin = estado.pin.slice(0, -1);
        else if (tecla === "ok") return enviar();
        else if (estado.pin.length < 4) estado.pin += tecla;
        desenharBolinhas();
        // Quatro dígitos: manda sozinho. Um toque a menos numa tela que a
        // pessoa usa de mão cheia.
        if (estado.pin.length === 4) enviar();
      }

      async function enviar() {
        if (estado.pin.length !== 4) {
          $("aviso").textContent = "O PIN tem 4 números.";
          return;
        }
        $("aviso").textContent = "Registrando…";
        try {
          const r = await api(`/v1/ponto/${TOKEN}/bater`, {
            method: "POST",
            body: JSON.stringify({
              atendente_id: estado.escolhida.id,
              pin: estado.pin,
              tipo: estado.tipo,
            }),
          });
          fim("✅", r.mensagem, `${estado.escolhida.nome} · bom turno!`);
        } catch (e) {
          estado.pin = "";
          desenharBolinhas();
          $("aviso").textContent = e.message;
        }
      }

      /* ---------- passo 4: pronto ---------- */
      function fim(marca, titulo, detalhe) {
        $("fim-marca").textContent = marca;
        $("fim-titulo").textContent = titulo;
        $("fim-detalhe").textContent = detalhe;
        mostrar("passo-fim", null);
        // Volta sozinho: o próximo da fila não pode depender de alguém tocar
        // em "voltar".
        setTimeout(async () => {
          estado = { pessoas: estado.pessoas, escolhida: null, tipo: null, pin: "" };
          await carregar();
          mostrar("passo-pessoas", null);
        }, 3500);
      }

      /* ---------- navegação ---------- */
      function mostrar(id, anterior) {
        for (const secao of document.querySelectorAll(".passo")) secao.classList.remove("ativo");
        $(id).classList.add("ativo");
        voltarPara = anterior;
      }

      for (const botao of document.querySelectorAll("[data-voltar]")) {
        botao.onclick = () => {
          if (voltarPara === "passo-acao") desenharAcoes();
          else mostrar("passo-pessoas", null);
        };
      }

      function diaBr(iso) {
        const [ano, mes, dia] = String(iso ?? "").slice(0, 10).split("-");
        return dia ? `${dia}/${mes}/${ano}` : "";
      }

      await carregar();
      // A lista se atualiza sozinha: quem bateu no celular do gerente ou
      // acabou de ganhar PIN aparece sem ninguém recarregar a página.
      setInterval(() => {
        if ($("passo-pessoas").classList.contains("ativo")) void carregar();
      }, 60_000);
    </script>
  </body>
</html>
